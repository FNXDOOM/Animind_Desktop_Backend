version: 2
updates:
  # The module itself. Grouped so one PR per week rather than one per advisory-free bump.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # go.mod and the toolchain: an Actions version that silently stops working is a
  # pipeline that quietly stopped testing.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The runtime image carries ffmpeg, which is the part of the stack most likely to have
  # a real fix in a point release.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

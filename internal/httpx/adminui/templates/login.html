{{define "login"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AniMind Admin</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand brand-center">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text"><strong>AniMind</strong><small>Admin console</small></span>
      </div>
      <h1>Sign in</h1>
      <p class="muted">Use an administrator account. Mobile and desktop users sign in from their own apps.</p>

      {{if .Error}}<div class="flash flash-bad" role="alert">{{.Error}}</div>{{end}}
      {{if .Notice}}<div class="flash flash-ok">{{.Notice}}</div>{{end}}

      <form class="stack" method="post" action="/admin/login">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <label class="field">
          <span>Email</span>
          <input class="input" type="email" name="email" value="{{.Email}}" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </div>
    <p class="auth-foot">AniMind backend admin · <a href="/health">API status</a></p>
  </main>
</body>
</html>{{end}}

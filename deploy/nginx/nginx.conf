# AniMind reverse proxy — the only container this stack publishes beyond loopback.
#
# Two things the API cannot do for itself: terminate the watch-party websocket upgrade, and
# hand the API a client address it is allowed to trust.
#
# The header block is repeated inside every location on purpose. nginx inherits
# proxy_set_header from the enclosing block only while the location sets none of its own, so
# a single shared block would silently drop X-Forwarded-For the moment a location added
# Upgrade — which is exactly the case that makes rate limiting key off a forged address.

# Only directives the stock /etc/nginx/nginx.conf leaves unset belong here: re-declaring
# sendfile or tcp_nopush aborts startup with a duplicate-directive error, because the main
# config already sets them in the same http context.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream animind_api {
    server api:3001;
    # One keepalive pool for the API: range requests and segment fetches are many short
    # responses to the same client, and a TCP handshake per segment shows up as latency.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # The API enforces its own 1 MiB JSON body limit and answers 400 in JSON. Passing more
    # through to it keeps that response shape rather than nginx's HTML 413.
    client_max_body_size 8m;
    client_body_timeout 30s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/animind.access.log;
    error_log  /var/log/nginx/animind.error.log warn;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Liveness of this container alone, so an unhealthy nginx means the proxy died rather
    # than the API behind it.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Watch parties: Engine.IO long polling and the websocket upgrade share this path. The hub
    # pings every 25 s, so a read timeout under roughly three of those cuts healthy sockets off
    # and every client reconnects at the same moment.
    location = /api/socket.io {
        proxy_pass http://animind_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not survive into a
        # rate-limit key. The API trusts this header only when TRUST_PROXY_HEADERS is on.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # Media: byte-range passthrough for the players, and HLS segments. Buffering would make
    # nginx stage each response in a temp file before forwarding it, which is what turns a
    # seek into a stall and a 206 into a delay.
    location ~ ^/api/(episodes/[^/]+/stream|hls/) {
        proxy_pass http://animind_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range and If-Range travel with the request unmodified: rewriting them would break
        # seeking in both players.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Everything else: the JSON API, auth, catalog, user data, admin.
    location / {
        proxy_pass http://animind_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The metrics listener is on 3002, which nginx never proxies and the compose file never
    # publishes. Anything that would expose it has to be an explicit decision.
    location = /metrics {
        return 404;
    }
}

# What Prometheus scrapes, and how often.
#
# The API's metrics listener is unauthenticated, so it is reachable only on the compose
# network. Adding a target here is the only way to give Grafana something to read.

global:
  scrape_interval: 10s
  evaluation_interval: 15s
  scrape_timeout: 8s

scrape_configs:
  - job_name: animind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3002"]
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
